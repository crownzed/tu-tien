<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tu Tiên Giới</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Noto+Serif:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@0,400;0,600;0,700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ═══════════ GAME WRAPPER (Flexbox Column) ═══════════ -->
  <div class="game-wrapper">

    <!-- ═══════════ HEADER ═══════════ -->
    <header class="header">
      <div class="header-content">
        <div class="title-section">
          <h1 class="game-title">Tu Tiên Giới</h1>
          <div class="player-info">
            Cảnh Giới <span id="hdr-level" class="jade-text font-bold">LV.1</span>
            <span class="sep">❖</span>
            Luân Hồi <span id="hdr-dlh" class="gold-text font-bold">0 ĐLH</span>
          </div>
        </div>
        <nav class="nav-bar">
          <button class="nav-btn" data-nav="status" title="Xem hồ sơ nhân vật">📜 Hồ Sơ</button>
          <button class="nav-btn" data-nav="inventory" title="Xem túi đồ &amp; trang bị">🎒 Túi Đồ</button>
          <button class="nav-btn" data-nav="phapbao" title="Quản lý Công Pháp & Pháp Bảo">📿 Tàng Kinh Các</button>
          <button class="nav-btn" data-nav="shop" title="Cửa hàng Luân Hồi">🛒 Cửa Hàng</button>
        </nav>
      </div>
    </header>

    <!-- ═══════════ STATUS BAR ═══════════ -->
    <div class="status-panel" id="status-bar">
      <!-- Khí Huyết -->
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-label">❤️ Khí Huyết</span>
          <span class="stat-value" id="hp-val">100/100</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill hp-fill" id="hp-fill"></div>
          <div id="hp-empty" style="display:none;"></div>
        </div>
        <span id="hp-pct" style="display:none">100%</span>
      </div>

      <!-- Chân Nguyên -->
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-label">💧 Chân Nguyên</span>
          <span class="stat-value" id="lk-val">100/100</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill mp-fill" id="lk-fill"></div>
          <div id="lk-empty" style="display:none;"></div>
        </div>
        <span id="lk-pct" style="display:none">100%</span>
      </div>

      <!-- Secondary Stats -->
      <div class="stat-row-extra">
        <div class="pill">☯️ Tu Vi <span id="tuvi-val" class="jade-text font-bold">0</span></div>
        <div class="pill">💎 Linh Thạch <span id="stones-val" class="gold-text font-bold">0</span></div>
        <div class="pill">⏳ Thọ <span id="tho-val" class="font-bold">16/120</span></div>
        <div class="pill">🍀 Cơ Duyên <span id="luck-val" class="font-bold">0</span></div>
        <div class="pill">✨ Hệ <span id="realm-val" class="gold-text font-bold">--</span></div>
        <div class="pill seal-badge" id="state-badge" data-state="NO_RUN">NO_RUN</div>
      </div>
      <!-- Core Attributes -->
      <div class="stat-row-extra" id="core-attrs-row" style="margin-top:6px;">
        <div class="pill attr-pill">💪 STR <span id="attr-str" class="font-bold" style="color:#e74c3c;">0</span></div>
        <div class="pill attr-pill">🛡️ CON <span id="attr-con" class="font-bold" style="color:#e67e22;">0</span></div>
        <div class="pill attr-pill">🌀 AGI <span id="attr-agi" class="font-bold" style="color:#2ecc71;">0</span></div>
        <div class="pill attr-pill">🔮 INT <span id="attr-int" class="font-bold" style="color:#3498db;">0</span></div>
        <div class="pill attr-pill">👁️ SPR <span id="attr-spr" class="font-bold" style="color:#9b59b6;">0</span></div>
        <div class="pill attr-pill">🍀 LUK <span id="attr-luk" class="font-bold" style="color:#f1c40f;">0</span></div>
      </div>
    </div>

    <!-- ═══════════ MAIN LOG ═══════════ -->
    <main class="main-log-area" id="main-log">
      <div class="log-inner" id="log-inner">
        <!-- Sự kiện sẽ được render động bởi renderer.js -->
      </div>
    </main>

    <!-- ═══════════ FOOTER ═══════════ -->
    <footer class="footer">
      <nav class="action-grid" id="quick-actions">
        <!-- JS tự động thêm các nút hành động -->
      </nav>
      <div class="cmd-line">
        <span class="cmd-prompt">Ý Niệm ❯</span>
        <input
          type="text"
          id="cmd-input"
          class="cmd-input"
          autocomplete="off"
          spellcheck="false"
          placeholder="Truyền âm nhập mật..."
          autofocus
        >
      </div>
    </footer>
  </div>

  <!-- ═══════════ COMBAT OVERLAY (position: fixed modal) ═══════════ -->
  <div class="combat-overlay modal-overlay" id="combat-overlay" style="display:none;">
    <div class="combat-card modal-panel">
      <div class="combat-enemy-header">
        <span class="enemy-icon" id="enemy-icon">🐉</span>
        <div class="enemy-details">
          <div class="enemy-name" id="enemy-name">Yêu Thú</div>
          <div class="enemy-hp-bar">
            <div class="progress-track" style="flex:1;">
              <div class="progress-fill hp-fill" id="enemy-hp-fill"></div>
              <div id="enemy-hp-empty" style="display:none"></div>
            </div>
            <span class="enemy-hp-text" id="enemy-hp-text">100/100</span>
          </div>
          <div class="enemy-stats-text" id="enemy-stats">ATK:0 | DEF:0</div>
          <div class="enemy-stats-text" id="enemy-stats-sub" style="font-size:.85em;opacity:.7;"></div>
        </div>
      </div>
      <div class="combat-log-box" id="combat-log"></div>
      <div class="combat-actions action-grid" id="combat-actions">
        <button class="action-btn combat primary" data-action="attack">⚔️ Tấn Công</button>
        <button class="action-btn combat" data-action="cast">✨ Thi Pháp</button>
        <button class="action-btn combat danger" data-action="forbidden_art">☠️ Cấm Thuật</button>
        <button class="action-btn combat" data-action="flee">🏃 Bỏ Chạy</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
